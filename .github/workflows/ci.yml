name: CI

# Every job runs on every event, including title edits: a skipped required check counts as passing,
# so skipping jobs on "edited" could hide an earlier failure on the same commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          scopes: |
            runner
            viewer
            settings
            packaging
            release
            deps
            ci
          requireScope: false

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Only rustfmt is needed here; nothing in this job compiles the app.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:scripts
      - run: npm run test:app
      - run: npm run check:config
      - run: npm run check:version

  windows:
    name: Windows installer
    uses: ./.github/workflows/build.yml
    with:
      platforms: windows
